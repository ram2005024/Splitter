
name: Splitter CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. BACKEND TESTS
  # ==========================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitter_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splitter_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile Python
        run: uv run python -m compileall -q app

      - name: Check application imports
        env:
          ENVIRONMENT: test
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/splitter_test_db"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: uv run python -c "import app.main; print('Application import successful')"

      - name: Test Alembic migrations
        env:
          ENVIRONMENT: test
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/splitter_test_db"
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: uv run pytest -v --tb=short

  # ==========================================
  # 2. FRONTEND TESTS
  # ==========================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ==========================================
  # 3. BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Normalize image owner
        id: owner
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/splitter-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/splitter-api:latest
          cache-from: type=gha,scope=splitter-api
          cache-to: type=gha,mode=max,scope=splitter-api

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/splitter-frontend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/splitter-frontend:latest
          cache-from: type=gha,scope=splitter-frontend
          cache-to: type=gha,mode=max,scope=splitter-frontend

  # ==========================================
  # 4. DEPLOY TO AWS EC2
  # ==========================================
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_OWNER,IMAGE_TAG
          script_stop: true
          script: |
            set -eu

            APP_DIR="/opt/splitter/Splitter"
            cd "$APP_DIR"

            echo "Checking production environment..."

            test -f .env || {
              echo "ERROR: .env file not found"
              exit 1
            }

            for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SECRET_KEY; do
              grep -qE "^${key}=.+" .env || {
                echo "ERROR: Missing or empty ${key} in .env"
                exit 1
              }
            done

            IMAGE_OWNER_LOWER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            cat > .images.env <<EOF
            BACKEND_IMAGE=ghcr.io/${IMAGE_OWNER_LOWER}/splitter-api:${IMAGE_TAG}
            FRONTEND_IMAGE=ghcr.io/${IMAGE_OWNER_LOWER}/splitter-frontend:${IMAGE_TAG}
            EOF

            chmod 600 .images.env

            DC="docker compose --env-file .env --env-file .images.env -f docker-compose.prod.yml"

            echo "Pulling new images..."
            $DC pull api frontend

            echo "Starting database and Redis..."
            $DC up -d postgres redis

            echo "Waiting for PostgreSQL..."
            DB_READY=0

            for i in $(seq 1 30); do
              if docker exec splitter_postgres_prod \
                sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                >/dev/null 2>&1; then
                DB_READY=1
                break
              fi

              sleep 2
            done

            if [ "$DB_READY" -ne 1 ]; then
              echo "ERROR: PostgreSQL did not become ready"
              docker logs --tail 100 splitter_postgres_prod || true
              exit 1
            fi

            echo "Starting application..."
            $DC up -d

            echo "Waiting for API health..."
            API_READY=0

            for i in $(seq 1 60); do
              STATUS="$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                splitter_api_prod 2>/dev/null || true)"

              if [ "$STATUS" = "healthy" ]; then
                API_READY=1
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
                echo "ERROR: API container status: $STATUS"
                docker logs --tail 150 splitter_api_prod || true
                exit 1
              fi

              sleep 5
            done

            if [ "$API_READY" -ne 1 ]; then
              echo "ERROR: API health check timed out"
              docker logs --tail 150 splitter_api_prod || true
              exit 1
            fi

            echo "Applying database migrations..."
            $DC exec -T api alembic upgrade head

            echo "Verifying current migration..."
            $DC exec -T api alembic current

            echo "Deployment successful"

            docker image prune -f

name: Splitter CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ram2005024/splitter-api
  IMAGE_FRONTEND: ghcr.io/ram2005024/splitter-frontend

jobs:
  # ===========================================================================
  # 1. BACKEND TEST & LINT SUITE
  # ===========================================================================
  test-backend:
    name: Test Backend (FastAPI & Alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitter_test_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --dev

      - name: Bytecode & Module Syntax Validation
        run: |
          uv run python -m compileall app tests
          uv run python -c "from app.main import app; print('FastAPI loaded successfully!')"

      - name: Test Alembic Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/splitter_test_db"
        run: uv run alembic upgrade head

      - name: Run Test Suite
        env:
          ENVIRONMENT: "test"
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: uv run pytest -v --tb=short

  # ===========================================================================
  # 2. FRONTEND VALIDATION & BUILD SUITE
  # ===========================================================================
  test-frontend:
    name: Test Frontend (TypeScript & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"

  # ===========================================================================
  # 3. BUILD & PUSH DOCKER IMAGES TO GITHUB CONTAINER REGISTRY (GHCR)
  # ===========================================================================
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository & Owner for Image Tags
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-api:latest
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/splitter-api:latest
            ghcr.io/${{ env.REPO_LOWER }}/splitter-api:${{ github.sha }}
            ghcr.io/ram2005024/splitter-api:latest
            ghcr.io/ram2005024/splitter-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-frontend:latest
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/splitter-frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/splitter-frontend:${{ github.sha }}
            ghcr.io/ram2005024/splitter-frontend:latest
            ghcr.io/ram2005024/splitter-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 4. CONTINUOUS DEPLOYMENT TO AWS EC2 VIA SSH
  # ===========================================================================
  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Check for EC2 Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::EC2_HOST or EC2_SSH_KEY secret not found. Skipping EC2 deployment step. See README for EC2 setup instructions."
          fi

      - name: Deploy Containers on AWS EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "─── [1/6] Navigating to or Initializing Project Directory ───"
            TARGET_DIR=""
            if [ -d "/opt/splitter/.git" ] || ([ -d "/opt/splitter" ] && [ -w "/opt/splitter" ]); then
              TARGET_DIR="/opt/splitter"
            elif [ -d "$HOME/splitter" ]; then
              TARGET_DIR="$HOME/splitter"
            elif [ -d "/opt/splitter" ]; then
              sudo chown -R $(whoami):$(whoami) /opt/splitter 2>/dev/null || true
              if [ -w "/opt/splitter" ]; then
                TARGET_DIR="/opt/splitter"
              else
                TARGET_DIR="$HOME/splitter"
              fi
            else
              TARGET_DIR="$HOME/splitter"
            fi

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            REPO_URL="https://ram2005024:${{ secrets.GITHUB_TOKEN }}@github.com/ram2005024/Splitter.git"

            if [ ! -d ".git" ]; then
              echo "Git repository not found in $TARGET_DIR. Initializing repository..."
              git init
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
            else
              echo "Existing git repository found. Updating remote credentials..."
              git remote set-url origin "$REPO_URL" || true
            fi

            echo "─── [2/6] Syncing Latest Repository Code ───"
            TARGET_BRANCH="${{ github.ref_name }}"
            [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="master"
            git fetch origin "$TARGET_BRANCH" --depth 1 || git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            OWNER_LOWER="ram2005024"

            if [ ! -f ".env" ]; then
              echo "Notice: .env not found on EC2. Initializing from .env.production.example..."
              if [ -f ".env.production.example" ]; then
                cp .env.production.example .env
              elif [ -f ".env.example" ]; then
                cp .env.example .env
              fi
            fi

            # Automatically configure ram2005024 and sanitize .env
            if [ -f ".env" ]; then
              sed -i "s|ghcr.io/your-github-username|ghcr.io/ram2005024|g" .env
              sed -i "s|your-github-username|ram2005024|g" .env
              grep -q "^GHCR_IMAGE_API=" .env && sed -i "s|^GHCR_IMAGE_API=.*|GHCR_IMAGE_API=ghcr.io/ram2005024/splitter-api:latest|g" .env || echo "GHCR_IMAGE_API=ghcr.io/ram2005024/splitter-api:latest" >> .env
              grep -q "^GHCR_IMAGE_FRONTEND=" .env && sed -i "s|^GHCR_IMAGE_FRONTEND=.*|GHCR_IMAGE_FRONTEND=ghcr.io/ram2005024/splitter-frontend:latest|g" .env || echo "GHCR_IMAGE_FRONTEND=ghcr.io/ram2005024/splitter-frontend:latest" >> .env

              # Ensure postgres credentials align with database container
              if grep -q "generate_a_strong_database_password_here" .env; then
                sed -i "s|generate_a_strong_database_password_here|postgres|g" .env
                sed -i "s|POSTGRES_USER=splitter_user|POSTGRES_USER=postgres|g" .env
                sed -i "s|splitter_user:postgres|postgres:postgres|g" .env
              fi
              # Ensure workers are set safely for t2/t3.micro
              sed -i "s|UVICORN_WORKERS=4|UVICORN_WORKERS=2|g" .env
            fi

            # Explicitly export the exact GHCR images for docker compose
            export GHCR_IMAGE_API="ghcr.io/ram2005024/splitter-api:latest"
            export GHCR_IMAGE_FRONTEND="ghcr.io/ram2005024/splitter-frontend:latest"

            # Auto-detect whether docker command requires sudo
            DOCKER_BIN="docker"
            if ! docker info >/dev/null 2>&1; then
              if sudo -n docker info >/dev/null 2>&1 || sudo docker info >/dev/null 2>&1; then
                DOCKER_BIN="sudo -E docker"
              fi
            fi

            echo "─── [3/6] Authenticating Docker with GHCR ───"
            GHCR_PASS="${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}"
            echo "$GHCR_PASS" | $DOCKER_BIN login ghcr.io -u "ram2005024" --password-stdin || true

            echo "─── [4/6] Pulling Latest Container Images ───"
            GHCR_IMAGE_API="ghcr.io/ram2005024/splitter-api:latest" GHCR_IMAGE_FRONTEND="ghcr.io/ram2005024/splitter-frontend:latest" $DOCKER_BIN compose -f docker-compose.prod.yml pull || $DOCKER_BIN compose pull

            echo "─── [5/6] Deploying Stack ───"
            GHCR_IMAGE_API="ghcr.io/ram2005024/splitter-api:latest" GHCR_IMAGE_FRONTEND="ghcr.io/ram2005024/splitter-frontend:latest" $DOCKER_BIN compose -f docker-compose.prod.yml up -d --remove-orphans || $DOCKER_BIN compose up -d --remove-orphans

            # Brief pause and restart nginx to ensure fresh upstream resolution
            sleep 3
            $DOCKER_BIN compose -f docker-compose.prod.yml restart nginx || true

            echo "─── [6/6] Executing Database Migrations & Status Inspection ───"
            $DOCKER_BIN compose -f docker-compose.prod.yml exec -T api alembic upgrade head || true
            $DOCKER_BIN image prune -af --filter "until=72h" || true

            echo "─── Container Health & Status ───"
            $DOCKER_BIN compose -f docker-compose.prod.yml ps

            echo "─── API Logs (Recent) ───"
            $DOCKER_BIN compose -f docker-compose.prod.yml logs api --tail=25 || true

            echo "=== Splitter deployed successfully to EC2! ==="

name: Splitter CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Only cancel superseded PR runs. A second push to main must never kill a
# deploy that is already running on the server.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ram2005024/splitter-api
  IMAGE_FRONTEND: ghcr.io/ram2005024/splitter-frontend

jobs:
  # ===========================================================================
  # 1. BACKEND TEST & LINT
  # ===========================================================================
  test-backend:
    name: Test Backend (FastAPI & Alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitter_test_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --dev

      - name: Bytecode & Module Syntax Validation
        run: |
          uv run python -m compileall app tests
          uv run python -c "from app.main import app; print('FastAPI loaded successfully!')"

      - name: Test Alembic Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/splitter_test_db"
        run: uv run alembic upgrade head

      - name: Run Test Suite
        env:
          ENVIRONMENT: "test"
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: uv run pytest -v --tb=short

  # ===========================================================================
  # 2. FRONTEND VALIDATION & BUILD
  # ===========================================================================
  test-frontend:
    name: Test Frontend (TypeScript & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"

  # ===========================================================================
  # 3. BUILD & PUSH IMAGES TO GHCR
  # ===========================================================================
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 4. DEPLOY TO AWS EC2 VIA SSH
  # ===========================================================================
  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Check for EC2 Secrets
        id: check-secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2_HOST or EC2_SSH_KEY secret not found. Skipping deployment."
          fi

      - name: Deploy Containers on AWS EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_IMAGE_API: ${{ env.IMAGE_API }}:${{ github.sha }}
          GHCR_IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: GH_TOKEN,GHCR_USER,GHCR_TOKEN,GHCR_IMAGE_API,GHCR_IMAGE_FRONTEND,REPO,BRANCH
          script: |
            set -euo pipefail

            echo "--- [1/7] Locate project directory (prefer the one holding the real .env) ---"
            APP_DIR=""
            for d in /opt/splitter "$HOME/splitter"; do
              if [ -f "$d/.env" ]; then APP_DIR="$d"; break; fi
            done
            APP_DIR="${APP_DIR:-$HOME/splitter}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            echo "Using $APP_DIR"

            echo "--- [2/7] Sync code (token is not stored in .git/config) ---"
            [ -d .git ] || git init -q
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://github.com/${REPO}.git"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --depth 1 origin "$BRANCH"
            git reset --hard FETCH_HEAD

            echo "--- [3/7] Validate .env (never modified by CI) ---"
            if [ ! -f .env ]; then
              [ -f .env.production.example ] && cp .env.production.example .env
              echo "::error::.env did not exist in $APP_DIR. A template was created. Fill in real values, then re-run."
              exit 1
            fi
            cp .env .env.bak
            for k in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SECRET_KEY; do
              grep -Eq "^${k}=.+" .env || { echo "::error::$k is missing or empty in .env"; exit 1; }
            done
            if grep -Eqi 'generate_a_strong|your-github-username|change_me|changeme' .env; then
              echo "::error::.env still contains placeholder values"; exit 1
            fi
            getenv() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | sed -e 's/^"//;s/"$//' -e "s/^'//;s/'$//"; }
            PGUSER="$(getenv POSTGRES_USER)"; PGDB="$(getenv POSTGRES_DB)"
            export PGPASSWORD="$(getenv POSTGRES_PASSWORD)"
            echo "  POSTGRES_USER=$PGUSER  POSTGRES_DB=$PGDB"

            # Nginx mounts these files. If they are missing, Docker creates
            # directories in their place and nginx fails to start.
            if [ ! -f nginx-selfsigned.crt ] || [ ! -f nginx-selfsigned.key ]; then
              rm -rf nginx-selfsigned.crt nginx-selfsigned.key
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout nginx-selfsigned.key -out nginx-selfsigned.crt -subj "/CN=localhost"
            fi

            DOCKER_BIN="docker"
            if ! docker info >/dev/null 2>&1; then DOCKER_BIN="sudo -E docker"; fi
            DC="$DOCKER_BIN compose --env-file .env -f docker-compose.prod.yml"

            echo "--- [4/7] Login to GHCR and pull ---"
            echo "$GHCR_TOKEN" | $DOCKER_BIN login ghcr.io -u "$GHCR_USER" --password-stdin
            $DC pull

            echo "--- [5/7] Start data services and verify DB credentials ---"
            $DC up -d postgres redis
            for i in $(seq 1 30); do
              [ "$($DOCKER_BIN inspect -f '{{.State.Health.Status}}' splitter_postgres_prod 2>/dev/null)" = healthy ] && break
              sleep 2
            done
            if ! $DOCKER_BIN run --rm --network splitter-prod_splitter_prod_net -e PGPASSWORD \
                 postgres:16-alpine psql -h postgres -U "$PGUSER" -d "$PGDB" -tAc 'select 1' >/dev/null; then
              echo "::error::Postgres rejected the credentials in .env. The data volume was probably created with different values (Postgres only reads them on first init)."
              exit 1
            fi

            echo "--- [6/7] Deploy full stack and migrate ---"
            $DC up -d --remove-orphans
            $DC restart nginx
            $DC exec -T api alembic upgrade head

            echo "--- [7/7] Cleanup and status ---"
            $DOCKER_BIN image prune -af || true
            $DC ps
            $DC logs api --tail=25
            echo "=== Splitter deployed successfully ==="

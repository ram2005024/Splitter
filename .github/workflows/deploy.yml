name: Splitter CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/splitter-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/splitter-frontend

jobs:
  # ===========================================================================
  # 1. BACKEND TEST & LINT SUITE
  # ===========================================================================
  test-backend:
    name: Test Backend (FastAPI & Alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitter_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splitter_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --dev

      - name: Bytecode & Module Syntax Validation
        run: |
          uv run python -m compileall app tests
          uv run python -c "from app.main import app; print('FastAPI loaded successfully!')"

      - name: Test Alembic Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/splitter_test_db"
        run: |
          uv run alembic upgrade head

      - name: Run Test Suite
        env:
          ENVIRONMENT: "test"
          DEBUG: "True"
          SECRET_KEY: "test-ci-secret-key-12345678901234567890123456789012"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: |
          uv run pytest -v --tb=short

  # ===========================================================================
  # 2. FRONTEND VALIDATION & BUILD SUITE
  # ===========================================================================
  test-frontend:
    name: Test Frontend (TypeScript & Next.js Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: npm run build

  # ===========================================================================
  # 3. BUILD & PUSH DOCKER IMAGES TO GHCR
  # ===========================================================================
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository & Owner for Image Tags
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Backend / API Image
      # -----------------------------------------------------------------------
      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-api:latest
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/splitter-api:latest
            ghcr.io/${{ env.REPO_LOWER }}/splitter-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Frontend Image
      # -----------------------------------------------------------------------
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-frontend:latest
            ghcr.io/${{ env.OWNER_LOWER }}/splitter-frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/splitter-frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/splitter-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 4. CONTINUOUS DEPLOYMENT TO AWS EC2 VIA SSH
  # ===========================================================================
  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      # -----------------------------------------------------------------------
      # Check EC2 Secrets
      # -----------------------------------------------------------------------
      - name: Check for EC2 Secrets
        id: check-secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "EC2 deployment secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2_HOST or EC2_SSH_KEY secret not found. Skipping EC2 deployment."
          fi

      # -----------------------------------------------------------------------
      # Deploy Containers
      # -----------------------------------------------------------------------
      - name: Deploy Containers on AWS EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "=================================================="
            echo "        SPLITTER EC2 DEPLOYMENT"
            echo "=================================================="

            # -----------------------------------------------------------------
            # 1. Navigate to project directory
            # -----------------------------------------------------------------
            echo ""
            echo "─── [1/7] Navigating to Project Directory ───"

            if [ -d "/opt/splitter" ]; then
              cd /opt/splitter
            elif [ -d "$HOME/splitter" ]; then
              cd "$HOME/splitter"
            else
              echo "ERROR: Directory /opt/splitter or $HOME/splitter not found!"
              exit 1
            fi

            echo "Project directory: $(pwd)"

            # -----------------------------------------------------------------
            # 2. Sync latest repository code
            # -----------------------------------------------------------------
            echo ""
            echo "─── [2/7] Syncing Latest Repository Code ───"

            git fetch origin

            if git show-ref --verify --quiet refs/remotes/origin/main; then
              git reset --hard origin/main
            elif git show-ref --verify --quiet refs/remotes/origin/master; then
              git reset --hard origin/master
            else
              echo "ERROR: Could not find origin/main or origin/master."
              exit 1
            fi

            echo "Current commit:"
            git log -1 --oneline

            # -----------------------------------------------------------------
            # 3. Authenticate Docker with GHCR
            # -----------------------------------------------------------------
            echo ""
            echo "─── [3/7] Authenticating Docker with GHCR ───"

            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io \
                -u "$GHCR_USERNAME" \
                --password-stdin
            else
              echo "GHCR credentials not provided."
              echo "Assuming GHCR images are public."
            fi

            # -----------------------------------------------------------------
            # 4. Detect Docker Compose file
            # -----------------------------------------------------------------
            echo ""
            echo "─── [4/7] Detecting Docker Compose File ───"

            if [ -f "docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            elif [ -f "docker-compose.yml" ]; then
              COMPOSE_FILE="docker-compose.yml"
            else
              echo "ERROR: No Docker Compose file found!"
              exit 1
            fi

            echo "Using: $COMPOSE_FILE"

            # -----------------------------------------------------------------
            # 5. Pull latest images
            # -----------------------------------------------------------------
            echo ""
            echo "─── [5/7] Pulling Latest Container Images ───"

            docker compose -f "$COMPOSE_FILE" pull

            # -----------------------------------------------------------------
            # 6. Run Alembic migrations
            # -----------------------------------------------------------------
            echo ""
            echo "─── [6/7] Executing Alembic Migrations ───"

            docker compose -f "$COMPOSE_FILE" run \
              --rm \
              --no-deps \
              backend \
              alembic upgrade head

            # -----------------------------------------------------------------
            # 7. Deploy application
            # -----------------------------------------------------------------
            echo ""
            echo "─── [7/7] Deploying Application Stack ───"

            docker compose -f "$COMPOSE_FILE" up \
              -d \
              --remove-orphans

            # -----------------------------------------------------------------
            # Verify deployment
            # -----------------------------------------------------------------
            echo ""
            echo "─── Verifying Deployment ───"

            sleep 10

            docker compose -f "$COMPOSE_FILE" ps

            echo ""
            echo "─── Recent Container Logs ───"

            docker compose -f "$COMPOSE_FILE" logs \
              --tail=50 \
              --no-color

            echo ""
            echo "=================================================="
            echo "     SPLITTER DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=================================================="
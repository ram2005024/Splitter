# =============================================================================
# docker-compose.prod.yml — Production Stack
# =============================================================================
# - Pulls pre-built images from GHCR (no builds on EC2)
# - DATABASE_URL is always built from POSTGRES_* in .env, so the API and the
#   database container can never disagree
# - A missing POSTGRES_* value stops the deploy instead of silently falling
#   back to postgres/postgres
# =============================================================================
name: splitter-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  ENVIRONMENT: production
  DEBUG: "False"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER missing in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB missing in .env}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  # ─── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: splitter_nginx_prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging
    networks: [splitter_prod_net]

  # ─── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-ghcr.io/ram2005024/splitter-frontend:latest}
    container_name: splitter_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks: [splitter_prod_net]

  # ─── FastAPI backend ────────────────────────────────────────────────────────
  api:
    image: ${GHCR_IMAGE_API:-ghcr.io/ram2005024/splitter-api:latest}
    container_name: splitter_api_prod
    restart: always
    env_file: [.env]
    environment:
      <<: *app-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *default-logging
    networks: [splitter_prod_net]

  # ─── Celery worker ──────────────────────────────────────────────────────────
  celery_worker:
    image: ${GHCR_IMAGE_API:-ghcr.io/ram2005024/splitter-api:latest}
    container_name: splitter_celery_worker_prod
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    restart: always
    env_file: [.env]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [splitter_prod_net]

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: splitter_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing in .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks: [splitter_prod_net]

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: splitter_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks: [splitter_prod_net]

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  splitter_prod_net:
    driver: bridge

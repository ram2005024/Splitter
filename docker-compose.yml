# =============================================================================
# docker-compose.yml — Default Production Stack
# (Alias to docker-compose.prod.yml)
# =============================================================================
# Run in production:
#   docker compose pull
#   docker compose up -d
#
# Run in local development with live reload:
#   docker compose -f docker-compose.dev.yml up --build
# =============================================================================
name: splitter-prod

services:
  # ─── Nginx Reverse Proxy (Single Entrypoint Port 80) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: splitter_nginx_prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - splitter_prod_net

  # ─── Next.js Frontend Application ───────────────────────────────────────────
  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-ghcr.io/ram2005024/splitter-frontend:latest}
    container_name: splitter_frontend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - splitter_prod_net

  # ─── FastAPI Production Backend ─────────────────────────────────────────────
  api:
    image: ${GHCR_IMAGE_API:-ghcr.io/ram2005024/splitter-api:latest}
    container_name: splitter_api_prod
    restart: always
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-splitter_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - splitter_prod_net

  # ─── Celery Background Worker ───────────────────────────────────────────────
  celery_worker:
    image: ${GHCR_IMAGE_API:-ghcr.io/ram2005024/splitter-api:latest}
    container_name: splitter_celery_worker_prod
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    restart: always
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-splitter_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - splitter_prod_net

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: splitter_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-splitter_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-splitter_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - splitter_prod_net

  # ─── Redis Cache & Broker ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: splitter_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - splitter_prod_net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  splitter_prod_net:
    driver: bridge

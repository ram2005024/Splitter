# =============================================================================
# docker/nginx.conf — Production Nginx Gateway with SSL / HTTPS
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Hide nginx version
    server_tokens off;

    # Rate limiting zone (100 requests per minute per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    upstream splitter_api {
        server api:8000;
        keepalive 32;
    }

    upstream splitter_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ─── HTTPS / SSL Server (Port 443) ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name ec2-13-51-194-166.eu-north-1.compute.amazonaws.com localhost _;

        ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 15M;
        client_body_timeout 30s;
        client_header_timeout 30s;

        # Health Check
        location /health {
            proxy_pass http://splitter_api/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # FastAPI Backend API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://splitter_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # Swagger Docs & OpenAPI Schema
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://splitter_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Next.js Frontend Application & WebSockets
        location / {
            proxy_pass http://splitter_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # ─── HTTP Server (Port 80) — Redirects to HTTPS ───────────────────────────
    server {
        listen 80;
        server_name ec2-13-51-194-166.eu-north-1.compute.amazonaws.com localhost _;

        # Health check permitted over HTTP for Docker healthchecks & AWS ELB
        location /health {
            proxy_pass http://splitter_api/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
